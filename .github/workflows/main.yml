name: Build Custom Linux Mint ISO

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download ISO and Setup
        run: |
          sudo apt update
          sudo apt install -y wget
          # Tải Linux Mint Cinnamon gốc
          wget -O mint.iso https://mirrors.edge.kernel.org/linuxmint/stable/21.3/linuxmint-21.3-cinnamon-64bit.iso

      - name: Upload ISO Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Custom-Linux-Mint-ISO
          path: ./mint.iso
