name: Build Custom Linux Mint ISO

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v3

      - name: Download ISO and Customize
        run: |
          sudo apt update
          sudo apt install -y cubic
          echo "Starting build process..."

      - name: Upload ISO
        uses: actions/upload-artifact@v3
        with:
          name: Custom-Linux-Mint-ISO
          path: ./*.iso
